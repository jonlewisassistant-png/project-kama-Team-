<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazcord - Espace collaboratif</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js" defer>
    </script>
    <style>
        :root {
            --bg-primary: #1a1b1e;
            --bg-secondary: #2c2f33;
            --bg-tertiary: #232428;
            --bg-sidebar: #1e1f22;
            --text-primary: #dcddde;
            --text-secondary: #949ba4;
            --text-muted: #6d6f78;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --success: #57f287;
            --danger: #ed4245;
            --warning: #fee75c;
            --border: #3f4147;
            --channel-active: #404249;
            --hover-bg: #35373c;
            --input-bg: #383a40;
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Écran de connexion */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 100;
        }
        #login-screen.hidden {
            display: none;
        }
        .login-card {
            background: var(--bg-secondary);
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 420px;
            max-width: 95vw;
        }
        .login-card .logo {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #5865f2, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card .subtitle {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 0.95em;
        }
        .login-card input {
            width: 100%;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1em;
            margin-bottom: 14px;
            outline: none;
            transition: var(--transition);
        }
        .login-card input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.15);
        }
        .login-card .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 22px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            flex: 1;
            min-width: 120px;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            flex: 1;
            min-width: 120px;
        }
        .btn-secondary:hover {
            background: var(--hover-bg);
        }
        .btn-small {
            padding: 6px 14px;
            font-size: 0.8em;
            border-radius: 4px;
            font-weight: 500;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            opacity: 0.85;
        }
        .room-id-display {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.85em;
            color: var(--text-secondary);
            word-break: break-all;
            margin-top: 8px;
            cursor: pointer;
            border: 1px dashed var(--border);
            transition: var(--transition);
        }
        .room-id-display:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .info-text {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Interface principale */
        #app-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: row;
        }
        #app-screen.active {
            display: flex;
        }

        /* Sidebar gauche (icônes canaux) */
        .sidebar-channels {
            width: 64px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 6px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .channel-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.3em;
            position: relative;
            border: 2px solid transparent;
            color: var(--text-secondary);
        }
        .channel-icon:hover {
            background: var(--accent);
            color: #fff;
            border-radius: 16px;
        }
        .channel-icon.active {
            background: var(--accent);
            color: #fff;
            border-radius: 16px;
            border-color: #fff3;
        }
        .channel-icon .tooltip {
            position: absolute;
            left: 58px;
            background: #000;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
        }
        .channel-icon:hover .tooltip {
            opacity: 1;
        }

        /* Zone principale */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
        }
        .top-bar {
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }
        .top-bar .channel-name {
            font-weight: 700;
            font-size: 1em;
            color: var(--text-primary);
        }
        .top-bar .room-badge {
            margin-left: auto;
            background: var(--bg-tertiary);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar .room-badge:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .top-bar .member-count {
            font-size: 0.8em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Panneau membres */
        .members-panel {
            width: 220px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 16px 12px;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .members-panel h4 {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.9em;
            color: var(--text-primary);
        }
        .member-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }
        .member-dot.self {
            background: var(--accent);
        }

        /* Chat */
        #chat-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            display: flex;
            gap: 10px;
            padding: 4px 0;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85em;
            color: #fff;
        }
        .msg-content {
            flex: 1;
            min-width: 0;
        }
        .msg-author {
            font-weight: 600;
            font-size: 0.9em;
            color: var(--text-primary);
        }
        .msg-time {
            font-size: 0.7em;
            color: var(--text-muted);
            margin-left: 6px;
        }
        .msg-text {
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.45;
        }
        .msg-text img {
            max-width: 280px;
            max-height: 200px;
            border-radius: var(--radius-sm);
            margin-top: 6px;
            cursor: pointer;
            display: block;
            border: 1px solid var(--border);
        }
        .msg-text video {
            max-width: 320px;
            max-height: 200px;
            border-radius: var(--radius-sm);
            margin-top: 6px;
            display: block;
        }
        .msg-text a {
            color: #6d9bf5;
            text-decoration: none;
        }
        .msg-text a:hover {
            text-decoration: underline;
        }
        .system-msg {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.8em;
            padding: 6px 0;
        }
        .chat-input-area {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            outline: none;
            font-family: var(--font);
            font-size: 0.9em;
        }
        .chat-input-area input:focus {
            border-color: var(--accent);
        }
        .chat-input-area button {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 1.1em;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area button:hover {
            background: var(--accent-hover);
        }
        .media-btn {
            background: var(--input-bg) !important;
            color: var(--text-secondary) !important;
            border: 1px solid var(--border) !important;
        }
        .media-btn:hover {
            color: #fff !important;
            border-color: var(--accent) !important;
        }

        /* Éditeur de code */
        #code-panel {
            display: none;
            flex: 1;
            flex-direction: row;
            min-width: 0;
            height: 100%;
        }
        #code-panel.active {
            display: flex;
        }
        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-right: 1px solid var(--border);
        }
        .editor-tabs {
            display: flex;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .editor-tab {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--font);
        }
        .editor-tab.active {
            color: #fff;
            border-bottom-color: var(--accent);
        }
        .editor-textarea {
            flex: 1;
            width: 100%;
            background: #1e1e2e;
            color: #cdd6f4;
            border: none;
            padding: 14px;
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.85em;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 2;
        }
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #fff;
        }
        .preview-header {
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .preview-header span {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .preview-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* Bloc-notes */
        #notes-panel {
            display: none;
            flex: 1;
            flex-direction: column;
            min-width: 0;
            height: 100%;
        }
        #notes-panel.active {
            display: flex;
        }
        .notes-textarea {
            flex: 1;
            width: 100%;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: none;
            padding: 20px;
            font-family: var(--font);
            font-size: 1em;
            resize: none;
            outline: none;
            line-height: 1.7;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .members-panel {
                display: none;
            }
            .sidebar-channels {
                width: 48px;
            }
            .channel-icon {
                width: 36px;
                height: 36px;
                font-size: 1em;
            }
            .editor-section,
            .preview-section {
                flex: none;
                width: 100%;
                height: 50%;
            }
            #code-panel {
                flex-direction: column;
            }
            .login-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Écran de connexion -->
    <div id="login-screen">
        <div class="login-card">
            <div class="logo">⚡ Fazcord</div>
            <p class="subtitle">Espace privé collaboratif pour toi et tes amis</p>
            <input type="text" id="username-input" placeholder="Ton pseudo" maxlength="20" autocomplete="off">
            <div class="btn-row">
                <button class="btn btn-primary" id="btn-create">✨ Créer un salon</button>
                <button class="btn btn-secondary" id="btn-join">🔗 Rejoindre un salon</button>
            </div>
            <input type="text" id="room-id-input" placeholder="ID du salon à rejoindre" style="display:none; margin-top:10px;">
            <button class="btn btn-secondary" id="btn-join-confirm" style="display:none; width:100%; margin-top:4px;">Rejoindre</button>
            <p class="info-text" id="login-info"></p>
        </div>
    </div>

    <!-- Application principale -->
    <div id="app-screen">
        <!-- Sidebar canaux -->
        <div class="sidebar-channels">
            <div class="channel-icon active" data-channel="chat" title="Chat">
                💬<span class="tooltip">Chat</span>
            </div>
            <div class="channel-icon" data-channel="code" title="Code">
                </>&<span class="tooltip">Code live</span>
            </div>
            <div class="channel-icon" data-channel="notes" title="Notes">
                📝<span class="tooltip">Bloc-notes</span>
            </div>
        </div>

        <!-- Zone principale -->
        <div class="main-area">
            <div class="top-bar">
                <span class="channel-name" id="channel-title">💬 Général</span>
                <span class="member-count" id="member-count-display">🟢 1 connecté</span>
                <div class="room-badge" id="room-badge" title="Cliquer pour copier l'ID du salon">
                    📋 <span id="room-id-text">---</span>
                </div>
            </div>
            <div class="content-area">
                <!-- Chat -->
                <div id="chat-panel">
                    <div class="messages-container" id="messages-container"></div>
                    <div class="chat-input-area">
                        <button class="media-btn" id="btn-media" title="Ajouter média (URL image/vidéo)">🖼️</button>
                        <input type="text" id="chat-input" placeholder="Écris un message..." autocomplete="off">
                        <button id="btn-send">➤</button>
                    </div>
                </div>

                <!-- Éditeur de code -->
                <div id="code-panel">
                    <div class="editor-section">
                        <div class="editor-tabs">
                            <button class="editor-tab active" data-lang="html">HTML</button>
                            <button class="editor-tab" data-lang="css">CSS</button>
                            <button class="editor-tab" data-lang="js">JS</button>
                        </div>
                        <textarea class="editor-textarea" id="editor-html" placeholder="<!-- HTML ici -->" spellcheck="false"></textarea>
                        <textarea class="editor-textarea" id="editor-css" placeholder="/* CSS ici */" style="display:none;" spellcheck="false"></textarea>
                        <textarea class="editor-textarea" id="editor-js" placeholder="// JS ici" style="display:none;" spellcheck="false"></textarea>
                    </div>
                    <div class="preview-section">
                        <div class="preview-header">
                            <span>🔍 Aperçu en direct</span>
                            <button class="btn btn-small btn-primary" id="btn-run">▶ Exécuter</button>
                        </div>
                        <iframe class="preview-iframe" id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" title="Aperçu"></iframe>
                    </div>
                </div>

                <!-- Bloc-notes -->
                <div id="notes-panel">
                    <textarea class="notes-textarea" id="notes-textarea" placeholder="📝 Notes collaboratives... Écris tes idées ici, tout le monde les verra en temps réel."></textarea>
                </div>
            </div>
        </div>

        <!-- Panneau membres -->
        <div class="members-panel" id="members-panel">
            <h4>🟢 En ligne</h4>
            <div id="members-list"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ ÉTAT GLOBAL ============
            let peer = null;
            let hostConnections = []; // connexions entrantes (si host)
            let hostPeerId = null; // ID du peer host (si on est client)
            let myUsername = '';
            let roomId = '';
            let isHost = false;
            let currentChannel = 'chat';
            let connectedPeers = new Map(); // peerId -> { username, connection }
            let myPeerId = '';

            // Contenus synchronisés
            let syncedCodeHTML = '';
            let syncedCodeCSS = '';
            let syncedCodeJS = '';
            let syncedNotes = '';
            let chatMessages = []; // { author, text, time, isSystem }

            // ============ ÉLÉMENTS DOM ============
            const loginScreen = document.getElementById('login-screen');
            const appScreen = document.getElementById('app-screen');
            const usernameInput = document.getElementById('username-input');
            const roomIdInput = document.getElementById('room-id-input');
            const btnCreate = document.getElementById('btn-create');
            const btnJoin = document.getElementById('btn-join');
            const btnJoinConfirm = document.getElementById('btn-join-confirm');
            const loginInfo = document.getElementById('login-info');
            const roomBadge = document.getElementById('room-badge');
            const roomIdText = document.getElementById('room-id-text');
            const channelTitle = document.getElementById('channel-title');
            const memberCountDisplay = document.getElementById('member-count-display');
            const messagesContainer = document.getElementById('messages-container');
            const chatInput = document.getElementById('chat-input');
            const btnSend = document.getElementById('btn-send');
            const btnMedia = document.getElementById('btn-media');
            const chatPanel = document.getElementById('chat-panel');
            const codePanel = document.getElementById('code-panel');
            const notesPanel = document.getElementById('notes-panel');
            const editorHTML = document.getElementById('editor-html');
            const editorCSS = document.getElementById('editor-css');
            const editorJS = document.getElementById('editor-js');
            const previewFrame = document.getElementById('preview-frame');
            const btnRun = document.getElementById('btn-run');
            const notesTextarea = document.getElementById('notes-textarea');
            const membersList = document.getElementById('members-list');
            const toast = document.getElementById('toast');
            const channelIcons = document.querySelectorAll('.channel-icon');
            const editorTabs = document.querySelectorAll('.editor-tab');

            // ============ FONCTIONS UTILITAIRES ============
            function showToast(msg, duration = 2000) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), duration);
            }

            function generateRoomId() {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let id = 'faz-';
                for (let i = 0; i < 10; i++) id += chars[Math.floor(Math.random() * chars.length)];
                return id;
            }

            function getAvatarLetter(name) {
                return name ? name.charAt(0).toUpperCase() : '?';
            }

            function formatTime() {
                const d = new Date();
                return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            }

            // ============ GESTION DU RÉSEAU P2P ============
            function broadcastToAll(data) {
                const payload = JSON.stringify(data);
                if (isHost) {
                    hostConnections.forEach(conn => {
                        if (conn.open) {
                            try { conn.send(payload); } catch (e) { /* déconnecté */ }
                        }
                    });
                } else if (hostPeerId && connectedPeers.has(hostPeerId)) {
                    const conn = connectedPeers.get(hostPeerId).connection;
                    if (conn && conn.open) {
                        try { conn.send(payload); } catch (e) { /* déconnecté */ }
                    }
                }
            }

            function broadcastChatMessage(author, text, isSystem = false) {
                const msg = { type: 'chat', author, text, time: formatTime(), isSystem };
                chatMessages.push(msg);
                renderChatMessage(msg);
                broadcastToAll(msg);
            }

            function broadcastCodeUpdate(lang, content) {
                const msg = { type: 'code-update', lang, content };
                broadcastToAll(msg);
            }

            function broadcastNotesUpdate(content) {
                const msg = { type: 'notes-update', content };
                broadcastToAll(msg);
            }

            function broadcastMembersUpdate() {
                const members = [];
                connectedPeers.forEach((data, pid) => members.push({ peerId: pid, username: data.username }));
                if (isHost) {
                    // host lui-même
                    members.push({ peerId: myPeerId, username: myUsername + ' (host)' });
                    const msg = { type: 'members-sync', members };
                    hostConnections.forEach(conn => {
                        if (conn.open) try { conn.send(JSON.stringify(msg)); } catch (e) {}
                    });
                }
                renderMembersList();
            }

            function requestStateSync(conn) {
                // Envoyer l'état complet à un nouveau pair
                const state = {
                    type: 'state-sync',
                    codeHTML: syncedCodeHTML,
                    codeCSS: syncedCodeCSS,
                    codeJS: syncedCodeJS,
                    notes: syncedNotes,
                    chatMessages: chatMessages.slice(-50), // derniers 50 messages
                    members: []
                };
                // Ajouter les membres actuels
                connectedPeers.forEach((data, pid) => state.members.push({ peerId: pid, username: data.username }));
                if (isHost) state.members.push({ peerId: myPeerId, username: myUsername + ' (host)' });
                if (conn && conn.open) {
                    try { conn.send(JSON.stringify(state)); } catch (e) {}
                }
            }

            function handleIncomingMessage(conn, rawData) {
                let data;
                try { data = JSON.parse(rawData); } catch (e) { return; }

                switch (data.type) {
                    case 'chat':
                        if (!data.isSystem) {
                            // Éviter les doublons si on reçoit notre propre message relayé
                            const isDuplicate = chatMessages.some(m =>
                                m.author === data.author && m.text === data.text && m.time === data.time && !m
                                .isSystem
                            );
                            if (!isDuplicate) {
                                chatMessages.push(data);
                                renderChatMessage(data);
                            }
                        } else {
                            chatMessages.push(data);
                            renderChatMessage(data);
                        }
                        break;
                    case 'code-update':
                        if (data.lang === 'html') {
                            syncedCodeHTML = data.content;
                            if (document.activeElement !== editorHTML) editorHTML.value = data.content;
                        } else if (data.lang === 'css') {
                            syncedCodeCSS = data.content;
                            if (document.activeElement !== editorCSS) editorCSS.value = data.content;
                        } else if (data.lang === 'js') {
                            syncedCodeJS = data.content;
                            if (document.activeElement !== editorJS) editorJS.value = data.content;
                        }
                        // Auto-refresh preview si on est sur le panneau code
                        if (currentChannel === 'code') updatePreview();
                        break;
                    case 'notes-update':
                        syncedNotes = data.content;
                        if (document.activeElement !== notesTextarea) notesTextarea.value = data.content;
                        break;
                    case 'members-sync':
                        // Reçu uniquement par les clients
                        connectedPeers.clear();
                        data.members.forEach(m => {
                            if (m.peerId !== myPeerId) {
                                connectedPeers.set(m.peerId, { username: m.username, connection: null });
                            }
                        });
                        // Mettre à jour la connexion host
                        if (hostPeerId && connectedPeers.has(hostPeerId)) {
                            connectedPeers.get(hostPeerId).connection = conn;
                        }
                        renderMembersList();
                        break;
                    case 'state-sync':
                        // Synchronisation complète de l'état
                        syncedCodeHTML = data.codeHTML || '';
                        syncedCodeCSS = data.codeCSS || '';
                        syncedCodeJS = data.codeJS || '';
                        syncedNotes = data.notes || '';
                        editorHTML.value = syncedCodeHTML;
                        editorCSS.value = syncedCodeCSS;
                        editorJS.value = syncedCodeJS;
                        notesTextarea.value = syncedNotes;
                        if (data.chatMessages && Array.isArray(data.chatMessages)) {
                            chatMessages = data.chatMessages;
                            messagesContainer.innerHTML = '';
                            chatMessages.forEach(m => renderChatMessage(m, true));
                            scrollChatBottom();
                        }
                        if (data.members) {
                            connectedPeers.clear();
                            data.members.forEach(m => {
                                if (m.peerId !== myPeerId) {
                                    connectedPeers.set(m.peerId, { username: m.username, connection: null });
                                }
                            });
                            if (hostPeerId && connectedPeers.has(hostPeerId) && conn) {
                                connectedPeers.get(hostPeerId).connection = conn;
                            }
                            renderMembersList();
                        }
                        if (currentChannel === 'code') updatePreview();
                        break;
                    case 'ping':
                        // keep-alive
                        break;
                }
            }

            function setupHostPeer() {
                isHost = true;
                hostPeerId = null;
                peer = new Peer(roomId, {
                    debug: 0
                });

                peer.on('open', (id) => {
                    myPeerId = id;
                    console.log('Host peer ouvert:', id);
                    connectedPeers.set(id, { username: myUsername + ' (host)', connection: null });
                    renderMembersList();
                    updateMemberCount();
                });

                peer.on('connection', (conn) => {
                    console.log('Nouvelle connexion entrante:', conn.peer);
                    hostConnections.push(conn);
                    connectedPeers.set(conn.peer, { username: '...', connection: conn });

                    conn.on('open', () => {
                        console.log('Connexion établie avec:', conn.peer);
                        // Envoyer l'état complet au nouveau pair
                        requestStateSync(conn);
                        broadcastMembersUpdate();
                        updateMemberCount();
                        broadcastChatMessage('Système', '🟢 Un ami vient de se connecter', true);
                    });

                    conn.on('data', (rawData) => {
                        const data = JSON.parse(rawData);
                        // Mise à jour du username
                        if (data.type === 'username-announce') {
                            if (connectedPeers.has(conn.peer)) {
                                connectedPeers.get(conn.peer).username = data.username;
                            }
                            broadcastMembersUpdate();
                            updateMemberCount();
                            broadcastChatMessage('Système', `👋 ${data.username} est dans le salon`, true);
                        } else if (data.type === 'chat' || data.type === 'code-update' || data.type ===
                            'notes-update') {
                            // Relayer aux autres clients
                            handleIncomingMessage(conn, rawData);
                            // Broadcast à tous les autres (sauf l'expéditeur)
                            hostConnections.forEach(c => {
                                if (c !== conn && c.open) {
                                    try { c.send(rawData); } catch (e) {}
                                }
                            });
                        }
                    });

                    conn.on('close', () => {
                        const username = connectedPeers.get(conn.peer)?.username || 'Quelqu\'un';
                        connectedPeers.delete(conn.peer);
                        hostConnections = hostConnections.filter(c => c !== conn);
                        broadcastMembersUpdate();
                        updateMemberCount();
                        broadcastChatMessage('Système', `🔴 ${username} s'est déconnecté`, true);
                    });

                    conn.on('error', () => {
                        connectedPeers.delete(conn.peer);
                        hostConnections = hostConnections.filter(c => c !== conn);
                        broadcastMembersUpdate();
                        updateMemberCount();
                    });
                });

                peer.on('error', (err) => {
                    console.error('Erreur Peer (host):', err);
                    showToast('❌ Erreur de connexion P2P');
                });

                peer.on('disconnected', () => {
                    console.log('Host déconnecté, tentative de reconnexion...');
                    peer.reconnect();
                });
            }

            function setupClientPeer(hostId) {
                isHost = false;
                hostPeerId = hostId;
                const clientId = 'faz-client-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                peer = new Peer(clientId, {
                    debug: 0
                });

                peer.on('open', (id) => {
                    myPeerId = id;
                    console.log('Client peer ouvert:', id);
                    connectToHost(hostId);
                });

                peer.on('error', (err) => {
                    console.error('Erreur Peer (client):', err);
                    if (err.type === 'peer-unavailable') {
                        showToast('❌ Salon introuvable. Vérifie l\'ID ou attends que l\'hôte soit connecté.');
                    }
                });

                peer.on('disconnected', () => {
                    console.log('Client déconnecté, tentative de reconnexion...');
                    peer.reconnect();
                });
            }

            function connectToHost(hostId) {
                const conn = peer.connect(hostId, {
                    reliable: true
                });
                conn.on('open', () => {
                    console.log('Connecté au host:', hostId);
                    connectedPeers.set(hostId, { username: 'Host', connection: conn });
                    // Annoncer notre username
                    conn.send(JSON.stringify({ type: 'username-announce', username: myUsername }));
                    renderMembersList();
                    updateMemberCount();
                });

                conn.on('data', (rawData) => {
                    handleIncomingMessage(conn, rawData);
                });

                conn.on('close', () => {
                    connectedPeers.delete(hostId);
                    renderMembersList();
                    updateMemberCount();
                    broadcastChatMessage('Système', '🔴 Connexion au salon perdue', true);
                    showToast('⚠️ Déconnecté du salon. Rafraîchis la page pour réessayer.');
                });

                conn.on('error', () => {
                    connectedPeers.delete(hostId);
                    renderMembersList();
                    updateMemberCount();
                });

                connectedPeers.set(hostId, { username: 'Host (connexion...)', connection: conn });
            }

            function updateMemberCount() {
                const count = connectedPeers.size + (isHost ? 1 : 0);
                memberCountDisplay.textContent = `🟢 ${count} connecté${count > 1 ? 's' : ''}`;
            }

            function renderMembersList() {
                membersList.innerHTML = '';
                const allMembers = [];
                if (isHost) {
                    allMembers.push({ peerId: myPeerId, username: myUsername + ' (host)', isSelf: true });
                }
                connectedPeers.forEach((data, pid) => {
                    allMembers.push({ peerId: pid, username: data.username, isSelf: pid === myPeerId });
                });
                if (!isHost && !allMembers.some(m => m.peerId === myPeerId)) {
                    allMembers.push({ peerId: myPeerId, username: myUsername + ' (moi)', isSelf: true });
                }

                allMembers.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'member-item';
                    div.innerHTML =
                        `<span class="member-dot ${m.isSelf ? 'self' : ''}"></span>${escapeHTML(m.username)}`;
                    membersList.appendChild(div);
                });
                updateMemberCount();
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============ RENDU CHAT ============
            function renderChatMessage(msg, appendOnly = false) {
                if (!appendOnly) {
                    // Vérifier si le message est déjà affiché (éviter doublons lors du state-sync)
                    const existing = messagesContainer.querySelectorAll('.message');
                    for (const el of existing) {
                        if (el.dataset.time === msg.time && el.dataset.author === msg.author && el.dataset.text === msg
                            .text) {
                            return; // déjà présent
                        }
                    }
                }

                if (msg.isSystem) {
                    const div = document.createElement('div');
                    div.className = 'system-msg';
                    div.textContent = msg.text;
                    div.dataset.time = msg.time;
                    div.dataset.author = msg.author;
                    div.dataset.text = msg.text;
                    messagesContainer.appendChild(div);
                } else {
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.dataset.time = msg.time;
                    div.dataset.author = msg.author;
                    div.dataset.text = msg.text;
                    const avatarLetter = getAvatarLetter(msg.author);
                    const safeText = escapeHTML(msg.text);
                    const linkedText = linkify(safeText);
                    const mediaHTML = renderMediaEmbeds(msg.text);
                    div.innerHTML = `
                <div class="msg-avatar">${avatarLetter}</div>
                <div class="msg-content">
                  <span class="msg-author">${escapeHTML(msg.author)}</span><span class="msg-time">${msg.time}</span>
                  <div class="msg-text">${linkedText}${mediaHTML}</div>
                </div>`;
                    messagesContainer.appendChild(div);
                }
                if (!appendOnly) scrollChatBottom();
            }

            function linkify(text) {
                // Remplacer les URLs par des liens cliquables (sauf si déjà dans une balise)
                const urlRegex = /(https?:\/\/[^\s<]+)/g;
                return text.replace(urlRegex, (url) => {
                    // Vérifier si c'est une image ou vidéo
                    const ext = url.split('?')[0].split('.').pop().toLowerCase();
                    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext)) {
                        return ''; // sera géré par renderMediaEmbeds
                    }
                    if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                        return ''; // sera géré par renderMediaEmbeds
                    }
                    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
                });
            }

            function renderMediaEmbeds(text) {
                const urlRegex = /(https?:\/\/[^\s<]+)/g;
                let html = '';
                let match;
                while ((match = urlRegex.exec(text)) !== null) {
                    const url = match[1];
                    const ext = url.split('?')[0].split('.').pop().toLowerCase();
                    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext)) {
                        html +=
                            `<img src="${url}" alt="Image partagée" loading="lazy" onclick="window.open('${url}','_blank')">`;
                    } else if (['mp4', 'webm', 'ogg', 'mov'].includes(ext)) {
                        html +=
                            `<video controls preload="metadata"><source src="${url}" type="video/${ext}">Vidéo non supportée</video>`;
                    }
                }
                return html;
            }

            function scrollChatBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function addSystemMessage(text) {
                const msg = { author: 'Système', text, time: formatTime(), isSystem: true };
                chatMessages.push(msg);
                renderChatMessage(msg);
                scrollChatBottom();
            }

            // ============ ENVOI DE MESSAGES ============
            function sendChatMessage() {
                const text = chatInput.value.trim();
                if (!text) return;
                chatInput.value = '';
                broadcastChatMessage(myUsername, text);
                scrollChatBottom();
            }

            function sendMediaURL() {
                const url = prompt('Colle l\'URL de l\'image ou de la vidéo :');
                if (!url || !url.trim()) return;
                const text = url.trim();
                broadcastChatMessage(myUsername, text);
                scrollChatBottom();
                chatInput.value = '';
            }

            // ============ ÉDITEUR DE CODE ============
            function updatePreview() {
                const html = editorHTML.value;
                const css = editorCSS.value;
                const js = editorJS.value;
                const fullCode = `<!DOCTYPE html>
        <html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
                previewFrame.srcdoc = fullCode;
            }

            function runCode() {
                updatePreview();
                showToast('✅ Code exécuté !', 1200);
            }

            // Synchronisation code avec debounce
            let codeDebounceTimers = {};
            function onCodeInput(lang) {
                clearTimeout(codeDebounceTimers[lang]);
                codeDebounceTimers[lang] = setTimeout(() => {
                    const content = lang === 'html' ? editorHTML.value : lang === 'css' ? editorCSS.value :
                        editorJS.value;
                    if (lang === 'html') syncedCodeHTML = content;
                    if (lang === 'css') syncedCodeCSS = content;
                    if (lang === 'js') syncedCodeJS = content;
                    broadcastCodeUpdate(lang, content);
                    if (currentChannel === 'code') updatePreview();
                }, 300);
            }

            // ============ BLOC-NOTES ============
            let notesDebounceTimer;
            function onNotesInput() {
                clearTimeout(notesDebounceTimer);
                notesDebounceTimer = setTimeout(() => {
                    syncedNotes = notesTextarea.value;
                    broadcastNotesUpdate(syncedNotes);
                }, 400);
            }

            // ============ CHANGEMENT DE CANAL ============
            function switchChannel(channel) {
                currentChannel = channel;
                channelIcons.forEach(icon => icon.classList.remove('active'));
                const activeIcon = document.querySelector(`.channel-icon[data-channel="${channel}"]`);
                if (activeIcon) activeIcon.classList.add('active');

                chatPanel.style.display = 'none';
                codePanel.classList.remove('active');
                notesPanel.classList.remove('active');

                if (channel === 'chat') {
                    chatPanel.style.display = 'flex';
                    channelTitle.textContent = '💬 Général';
                } else if (channel === 'code') {
                    codePanel.classList.add('active');
                    channelTitle.textContent = '</> Code live';
                    updatePreview();
                } else if (channel === 'notes') {
                    notesPanel.classList.add('active');
                    channelTitle.textContent = '📝 Bloc-notes';
                }
            }

            // ============ CONNEXION / DÉCONNEXION ============
            function startApp() {
                loginScreen.classList.add('hidden');
                appScreen.classList.add('active');
                roomIdText.textContent = roomId;
                switchChannel('chat');
                renderMembersList();
                updateMemberCount();
                addSystemMessage('✅ Connecté au salon Fazcord');
                addSystemMessage(`📋 ID du salon : ${roomId} (clique en haut pour copier)`);
                scrollChatBottom();
            }

            function createRoom() {
                myUsername = usernameInput.value.trim();
                if (!myUsername) {
                    showToast('⚠️ Entre un pseudo d\'abord');
                    return;
                }
                roomId = generateRoomId();
                setupHostPeer();
                startApp();
            }

            function joinRoom() {
                myUsername = usernameInput.value.trim();
                if (!myUsername) {
                    showToast('⚠️ Entre un pseudo d\'abord');
                    return;
                }
                const rid = roomIdInput.value.trim();
                if (!rid) {
                    showToast('⚠️ Entre l\'ID du salon à rejoindre');
                    return;
                }
                roomId = rid;
                setupClientPeer(rid);
                startApp();
            }

            function showJoinInput() {
                if (!usernameInput.value.trim()) {
                    showToast('⚠️ Entre un pseudo d\'abord');
                    return;
                }
                roomIdInput.style.display = 'block';
                btnJoinConfirm.style.display = 'block';
                loginInfo.textContent = 'Colle l\'ID du salon partagé par ton ami';
                roomIdInput.focus();
            }

            // ============ ÉVÉNEMENTS ============
            btnCreate.addEventListener('click', createRoom);
            btnJoin.addEventListener('click', showJoinInput);
            btnJoinConfirm.addEventListener('click', joinRoom);
            btnSend.addEventListener('click', sendChatMessage);
            btnMedia.addEventListener('click', sendMediaURL);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
            roomIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') joinRoom();
            });
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    if (roomIdInput.style.display === 'block') joinRoom();
                    else createRoom();
                }
            });

            roomBadge.addEventListener('click', () => {
                navigator.clipboard.writeText(roomId).then(() => {
                    showToast('📋 ID du salon copié ! Partage-le avec tes amis');
                }).catch(() => {
                    showToast('📋 ID : ' + roomId);
                });
            });

            channelIcons.forEach(icon => {
                icon.addEventListener('click', () => {
                    switchChannel(icon.dataset.channel);
                });
            });

            btnRun.addEventListener('click', runCode);

            // Onglets éditeur
            editorTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    editorTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const lang = tab.dataset.lang;
                    editorHTML.style.display = lang === 'html' ? 'block' : 'none';
                    editorCSS.style.display = lang === 'css' ? 'block' : 'none';
                    editorJS.style.display = lang === 'js' ? 'block' : 'none';
                });
            });

            // Événements de saisie code
            editorHTML.addEventListener('input', () => onCodeInput('html'));
            editorCSS.addEventListener('input', () => onCodeInput('css'));
            editorJS.addEventListener('input', () => onCodeInput('js'));

            // Événement bloc-notes
            notesTextarea.addEventListener('input', onNotesInput);

            // Initialisation : cacher les panels non actifs
            codePanel.classList.remove('active');
            notesPanel.classList.remove('active');

            // Contenu initial des éditeurs
            editorHTML.value = `<h1>Hello Fazcord !</h1>\n<p>Modifie ce code et clique sur Exécuter ✨</p>`;
            editorCSS.value = `body {\n  font-family: sans-serif;\n  padding: 20px;\n  background: #f0f0f0;\n}\nh1 {\n  color: #5865f2;\n}`;
            editorJS.value = `console.log('Bienvenue sur Fazcord !');`;
            syncedCodeHTML = editorHTML.value;
            syncedCodeCSS = editorCSS.value;
            syncedCodeJS = editorJS.value;

            // Gestion de la déconnexion/nettoyage
            window.addEventListener('beforeunload', () => {
                if (peer) {
                    peer.destroy();
                }
            });

            // Gestion du redimensionnement
            window.addEventListener('resize', () => {
                if (currentChannel === 'code') updatePreview();
            });

            console.log('🚀 Fazcord prêt !');
            console.log('💡 Crée un salon et partage l\'ID avec tes amis pour tester la collaboration en temps réel.');
            console.log('⚠️ Nécessite WebRTC (navigateurs modernes). Les deux pairs doivent être en ligne simultanément.');
        })();
    </script>
</body>
</html>
